<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Files | Asadbek Nosirjonov</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --ink: #0f172a;
      --muted: #475569;
      --line: #dfe4ee;
      --primary: #4338ca;
      --hero-1: #1e1b4b;
      --hero-2: #3730a3;
      --focus: #b45309;
      --focus-dark: #fcd34d;
      --radius: 18px;
      --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 1.0625rem; line-height: 1.6; }
    .skip { position: absolute; left: 16px; top: -80px; z-index: 100; background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 10px; font-weight: 700; text-decoration: none; }
    .skip:focus { top: 16px; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 6px; }
    .hero :focus-visible, .skip:focus-visible, .file:focus-visible { outline-color: var(--focus-dark); }

    .hero {
      color: #fff;
      background:
        radial-gradient(circle at 88% 0%, rgba(34, 211, 238, .22), transparent 45%),
        radial-gradient(circle at 0% 100%, rgba(129, 140, 248, .45), transparent 50%),
        linear-gradient(135deg, var(--hero-1), var(--hero-2));
    }
    .hero .inner { max-width: 900px; margin: 0 auto; padding: 32px 20px 96px; }
    .back { color: #fff; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
    h1 { font-size: clamp(2.1rem, 6vw, 3.2rem); line-height: 1.08; letter-spacing: -.03em; margin: 22px 0 0; }

    .content { max-width: 900px; margin: -56px auto 0; padding: 0 20px 56px; }
    .files { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .files li { display: flex; }
    .file {
      display: flex; align-items: center; gap: 16px; width: 100%;
      padding: 26px 24px; border-radius: var(--radius); color: #fff; text-decoration: none;
      box-shadow: 0 10px 30px -12px rgba(30, 27, 75, .35);
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .file:hover { transform: translateY(-3px); box-shadow: 0 18px 40px -16px rgba(30, 27, 75, .5); }
    .file.pdf { background: linear-gradient(135deg, #134e4a, #0f766e); }
    .file.pptx { background: linear-gradient(135deg, #1e3a5f, #155e75); }
    .file .icon { flex: none; width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; background: rgba(255, 255, 255, .15); font-size: 1.6rem; }
    .file strong { display: block; font-size: 1.45rem; letter-spacing: -.01em; line-height: 1.2; }
    .file span.meta { display: block; color: #e0f2fe; font-size: .95rem; margin-top: 2px; }

    footer { max-width: 900px; margin: 0 auto; padding: 0 20px 32px; color: var(--muted); font-size: .92rem; }
    @media (max-width: 640px) { .files { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <a class="skip" href="#files">Skip to files</a>
  <main>
    <header class="hero">
      <div class="inner">
        <a class="back" href="../index.html">&larr; All weeks</a>
        <h1>These are our team project files</h1>
      </div>
    </header>

    <div class="content">
      <ul class="files" id="files">
        <li>
          <a class="file pdf" href="AI-Travel-Planner-Proposal.pdf">
            <span class="icon" aria-hidden="true">&#128196;</span>
            <span><strong>Website Proposal</strong><span class="meta">PDF · 3.1 MB · opens in browser</span></span>
          </a>
        </li>
        <li>
          <a class="file pptx" href="TravelAI-Presentation.pptx" download>
            <span class="icon" aria-hidden="true">&#128202;</span>
            <span><strong>Presentation</strong><span class="meta">PPTX · 3.3 MB · downloads file</span></span>
          </a>
        </li>
      </ul>
    </div>
  </main>

  <footer>Asadbek Nosirjonov · ID 202537228 · Computer Engineering</footer>
</body>
</html>
