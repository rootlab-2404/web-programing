<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>topic 21</title>
    <style>
        .flex-row {
            display: flex;
            gap: 12px;
            background: #f8fafc;
            padding: 16px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            margin-bottom: 16px;
        }
        .flex-row.between { justify-content: space-between; }

        .item {
            background: #7c3aed;
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: 600;
        }
        .item.tall { height: 60px; display: flex; align-items: center; }
        .item.grow { flex: 1; }
    </style>
</head>
<body>
    <div class="flex-row">
        <div class="item">Prev</div>
        <div class="item">Play</div>
        <div class="item">Next</div>
    </div>

    <div class="flex-row between">
        <div class="item">Volume</div>
        <div class="item">Playlist</div>
    </div>

    <div class="flex-row">
        <div class="item tall">music</div>
        <div class="item grow">flex:1 — song title fills remaining width</div>
    </div>
</body>
</html>
