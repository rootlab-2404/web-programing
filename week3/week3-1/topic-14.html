<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>topic 14</title>
    <style>
        .normal  { font-style: normal; }
        .italic  { font-style: italic; }
        .oblique { font-style: oblique; }

        blockquote {
            font-style: italic;
            color: #475569;
            border-left: 3px solid #2563eb;
            padding-left: 16px;
        }

        .caption {
            font-style: italic;
            font-size: 0.875rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <p class="normal">Normal — standard news paragraph text</p>
    <p class="italic">Italic — foreign phrase: "carpe diem"</p>
    <p class="oblique">Oblique — artificially slanted disclaimer text</p>

    <blockquote>"The only way to do great work is to love what you do."</blockquote>
    <p class="caption">Photo credit: Reuters, taken on site</p>
</body>
</html>
