<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>topic 11</title>
    <style>
        .health   { background-color: rgb(220, 38, 38); color: white; }
        .mana     { background-color: rgb(37, 99, 235); color: white; }
        .xp       { background-color: rgb(234, 179, 8); }
        .stamina  { background-color: rgb(120, 120, 120); color: white; }

    /* rgba — translucent effects */
        .damage-popup {
            background-color: rgba(255, 255, 255, 0.6);
            color: black;
            padding: 20px;
        }
        .tooltip {
            background-color: rgba(37, 99, 235, 0.15);
            border: 1px solid rgba(37, 99, 235, 0.4);
            padding: 12px;
        }
        div { padding: 8px 16px; margin: 6px; }
    </style>
</head>
<body>
    <div class="health">rgb(220, 38, 38) — Health bar</div>
    <div class="mana">rgb(37, 99, 235) — Mana bar</div>
    <div class="xp">rgb(234, 179, 8) — XP bar</div>
    <div class="stamina">rgb(120, 120, 120) — Stamina bar</div>
    <div class="damage-popup">rgba(255,255,255,0.6) — Damage number overlay</div>
    <div class="tooltip">rgba green tint — Item tooltip card</div>

</body>
</html>
