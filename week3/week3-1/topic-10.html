<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>topic 10</title>
    <style>
        .strawberry { background-color: #DC143C; color: white; }
        .lime       { background-color: #32CD32; }
        .blueberry  { background-color: #4169E1; color: white; }
        .banana     { background-color: #FFE135; }
        .grape      { background-color: #6A0DAD; color: white; }
        .coconut    { background-color: #FFFFFF; border: 1px solid #ccc; }

        /* Shorthand example */
        .short-cherry { background-color: #F00; color: white; }

        div {
            padding: 8px 16px;
            margin: 4px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="strawberry">#DC143C Strawberry</div>
    <div class="lime">#32CD32 Lime</div>
    <div class="blueberry">#4169E1 Blueberry</div>
    <div class="banana">#FFE135 Banana</div>
    <div class="grape">#6A0DAD Grape</div>
    <div class="coconut">#FFFFFF Coconut</div>
    <div class="short-cherry">#F00 Cherry (shorthand)</div>
</body>
</html>
