<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>topic 12</title>
    <style>
        html { font-size: 100%; }

        .caption       { font-size: 0.875rem; }  /* 14px */
        .body-text     { font-size: 1rem; }      /* 16px */
        .subheading    { font-size: 1.25rem; }   /* 20px */
        .chapter-title { font-size: 1.5rem; }    /* 24px */
        .book-title    { font-size: 2rem; }      /* 32px */

        /* em example — relative to parent */
        .quote-box  { font-size: 20px; }
        .quote-em   { font-size: 1.5em; }  /* 1.5 × 20px = 30px */
    </style>

</head>
<body>
    <p class="caption">0.875rem — image caption text</p>
    <p class="body-text">1rem — main reading text</p>
    <p class="subheading">1.25rem — chapter subheading</p>
    <p class="chapter-title">1.5rem — chapter title</p>
    <p class="book-title">2rem — book title</p>

    <div class="quote-box">
        <p class="quote-em">1.5em — highlighted quote inside a styled box</p>
    </div>
</body>
</html>
