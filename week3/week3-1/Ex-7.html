<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f0fdfa;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background-color: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-color: #10B981;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .name {
      font-size: 1.5rem;
      font-weight: bold;
      margin: 0;
    }

    .role {
      color: #64748b;
      margin: 8px 0;
    }

    hr {
      border: none;
      border-top: 1px solid #e2e8f0;
      margin: 20px 0;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .badge {
      background-color: #10B981;
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
    }

    .student-id {
      color: #64748b;
      font-size: 0.9rem;
      margin-top: 5px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="avatar">A</div>

    <h2 class="name">Asadbek</h2>

    <p class="role">Web Programming Student</p>

    <p class="student-id">Student ID: 202537228</p>

    <hr>

    <div class="skills">
      <span class="badge">HTML5</span>
      <span class="badge">CSS3</span>
      <span class="badge">Flexbox</span>
    </div>

  </div>

</body>
</html>
