<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>topic 8</title>
    
    <style>
        body { color: #1e293b; }
        h2 { color: crimson; }
        .excellent { color: gold; }
        .good      { color: #16a34a; }
        .average   { color: rgb(59, 130, 246); }
        .poor      { color: hsl(280, 70%, 50%); }
        .neutral   { color: #94a3b8; }
    </style>


    
</head>
<body>
    <h2>Movie Review Colors</h2>
    <p class="excellent">Excellent rating: 9.5/10</p>
    <p class="good">Good rating: #16a34a hex code</p>
    <p class="average">Average rating: rgb(59, 130, 246)</p>
    <p class="poor">Poor rating: hsl(280, 70%, 50%)</p>
    <p class="neutral">Neutral grey text</p>


</body>
</html>
