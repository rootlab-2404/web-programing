<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>topic 13</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            font-size: 1.1rem;
        }

        .w300 { font-weight: 300; }  /* Light */
        .w400 { font-weight: 400; }  /* Regular */
        .w500 { font-weight: 500; }  /* Medium */
        .w600 { font-weight: 600; }  /* SemiBold */
        .w700 { font-weight: 700; }  /* Bold */
        .w900 { font-weight: 900; }  /* Black */
    </style>
    
</head>
<body>
    
    <p class="w300">300 — Light: "Appetizers"</p>
    <p class="w400">400 — Regular: "Grilled chicken with rice"</p>
    <p class="w500">500 — Medium: "Chef's recommendation"</p>
    <p class="w600">600 — SemiBold: "Today's special"</p>
    <p class="w700">700 — Bold: "$24.99"</p>
    <p class="w900">900 — Black: "SOLD OUT"</p>
</body>
</html>
