<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Asadbek - CSS Portfolio</title>

  <style>
    /* 1. Reset */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* 2. Base styles */
    body {
      font-family: "Segoe UI", sans-serif;
      font-size: 1rem;
      line-height: 1.6;
      color: #1e293b;
      background-color: #f0fdfa;
    }

    a {
      text-decoration: none;
    }

    h1 {
      font-size: 2.5rem;
    }

    h2 {
      font-size: 1.75rem;
      margin-bottom: 24px;
    }

    h3 {
      font-size: 1.1rem;
      margin-bottom: 8px;
      color: #0f766e;
    }

    p {
      color: #475569;
    }

    /* 3. Navigation */
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #134e4a;
      padding: 16px 40px;
    }

    .nav-logo {
      color: #5eead4;
      font-weight: 700;
      font-size: 1.3rem;
    }

    .nav-links {
      display: flex;
      gap: 24px;
    }

    .nav-links a {
      color: #ccfbf1;
      font-size: 0.9rem;
    }

    .nav-links a:hover {
      color: #5eead4;
    }

    /* 4. Hero section */
    .hero {
      text-align: center;
      padding: 80px 20px;
    }

    .hero h1 {
      color: #115e59;
      margin-bottom: 12px;
    }

    .hero p {
      margin-bottom: 24px;
    }

    .btn {
      display: inline-block;
      background-color: #0f766e;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
    }

    .btn:hover {
      background-color: #115e59;
    }

    /* 5. Skills grid */
    .skills-section {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px;
      text-align: center;
    }

    .skills-grid {
      display: flex;
      gap: 20px;
    }

    .skill-card {
      flex: 1;
      background-color: white;
      border: 1px solid #99f6e4;
      padding: 25px;
      border-radius: 12px;
    }

    /* 6. Footer */
    .footer {
      margin-top: 40px;
      background-color: #134e4a;
      text-align: center;
      padding: 25px;
    }

    .footer p {
      color: #ccfbf1;
    }

    /* Responsive design */
    @media (max-width: 700px) {
      .nav {
        padding: 16px 20px;
      }

      .nav-links {
        gap: 12px;
      }

      .hero h1 {
        font-size: 2rem;
      }

      .skills-grid {
        flex-direction: column;
      }
    }

    @media (max-width: 450px) {
      .nav {
        flex-direction: column;
        gap: 12px;
      }

      .nav-links {
        flex-wrap: wrap;
        justify-content: center;
      }
    }
  </style>
</head>

<body>

  <nav class="nav">
    <span class="nav-logo">Asadbek</span>

    <div class="nav-links">
      <a href="#skills">Skills</a>
      <a href="#contact">Contact</a>
    </div>
  </nav>

  <section class="hero">
    <h1>Hello, I am Asadbek!</h1>

    <p>
      Student ID: 202537228 · Web Programming · Gachon University
    </p>

    <a href="#skills" class="btn">See My Skills</a>
  </section>

  <section class="skills-section" id="skills">
    <h2>What I Know</h2>

    <div class="skills-grid">
      <div class="skill-card">
        <h3>HTML5</h3>
        <p>Structure and semantics</p>
      </div>

      <div class="skill-card">
        <h3>CSS3</h3>
        <p>Styling and layout</p>
      </div>

      <div class="skill-card">
        <h3>Flexbox</h3>
        <p>Modern layout model</p>
      </div>
    </div>
  </section>

  <footer class="footer" id="contact">
    <p>
      K0126002 Web Programming &copy; 2026 Gachon University
    </p>
  </footer>

</body>
</html>
