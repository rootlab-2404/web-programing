<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>topic 4</title>
    <style>
        /*Universal selector reset: removes default margin/padding from every element 
and makes box-sizing predictable so width includes padding and border*/
          .important{
            background-color: aqua;
          }

          *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
          }

          body {
            font-family: sans-serif;
            padding: 20px;
          }
    </style>
</head>
<body>
    <h1>this is topic 4 </h1>
    <p>around this paragraph there is defeault space before the reset</p>
    <p>second one is right below the first one</p>
    <h2 class="important">Universal selector reset: removes default margin,padding from every element 
and makes box-sizing predictable so width includes padding and border</h2>
    
</body>
</html>
