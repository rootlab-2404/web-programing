<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>topic 25</title>

    <style>
        /* Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Page */
        body {
            font-family: Arial, sans-serif;
            background-color: #e6fffb;
            color: #243333;
            min-height: 100vh;
            padding: 30px 15px;
        }

        /* Main container */
        .container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }

        /* Profile card */
        .card {
            background-color: white;
            border-radius: 18px;
            padding: 35px;
            border: 1px solid #99e6dd;
            box-shadow: 0 8px 25px rgba(0, 128, 128, 0.12);
        }

        /* Profile header */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 22px;
            margin-bottom: 25px;
        }

        /* Avatar */
        .avatar {
            width: 85px;
            height: 85px;
            min-width: 85px;
            border-radius: 50%;
            background-color: #0f9d91;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            font-size: 14px;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        /* Name */
        h1 {
            color: #087f78;
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        /* Student information */
        .role {
            color: #667777;
            font-size: 0.95rem;
        }

        /* Divider */
        hr {
            border: none;
            border-top: 1px solid #cce9e6;
            margin: 25px 0;
        }

        /* Description */
        .description {
            line-height: 1.7;
            margin-bottom: 20px;
        }

        /* Skills */
        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .skill {
            background-color: #d4f7f3;
            color: #087f78;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        /* Contact section */
        .contact {
            margin-top: 25px;
            padding: 18px;
            background-color: #c7f8f1;
            border-radius: 12px;
        }

        .contact strong {
            color: #0f877f;
        }

        /* Mobile responsive design */
        @media (max-width: 500px) {

            body {
                padding: 20px 10px;
            }

            .card {
                padding: 25px 20px;
            }

            .profile-header {
                flex-direction: column;
                text-align: center;
            }

            h1 {
                font-size: 1.5rem;
            }

            .avatar {
                width: 75px;
                height: 75px;
                min-width: 75px;
            }

            .skills {
                justify-content: center;
            }
        }
    </style>
</head>

<body>

    <!-- Main profile container -->
    <div class="container">

        <div class="card">

            <!-- Profile header -->
            <div class="profile-header">

                
                <div class="avatar">
                     <img src="pic1.jpg" alt="pic1"> 
                   
                </div>

                <div>
                    <h1>Asadbek</h1>
                    <p class="role">
                        Web Programming Student
                    </p>
                    <p class="role">
                        Student ID: 202537228
                    </p>
                </div>

            </div>

            <hr>

            
            <p class="description">
                Hello! My name is Asadbek. I am learning
                HTML and CSS and improving my web programming skills.
            </p>

            
            <div class="skills">
                <span class="skill">HTML5</span>
                <span class="skill">CSS3</span>
                <span class="skill">Flexbox</span>
                <span class="skill">Responsive Design</span>
            </div>

            <!-- Contact / information -->
            <div class="contact">
                <p><strong>Name:</strong> Asadbek</p>
                <p><strong>Student ID:</strong> 202537228</p>
                <p><strong>Course:</strong> Web Programming</p>
            </div>

        </div>

    </div>

</body>
</html>
