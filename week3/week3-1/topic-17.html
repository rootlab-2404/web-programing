<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>topic 17</title>
    <style>
        .item-card {
            background: #fdf2f8;
            border: 2px solid #ec4899;
            padding: 12px;
            width: 280px;
        }

        .m-none  { margin: 0; }
        .m-all   { margin: 20px; }
        .m-auto  { margin: 0 auto; }

        /* Collapse demo */
        .product1 { margin-bottom: 20px; background: #fef3c7; padding: 8px; }
        .product2 { margin-top: 30px; background: #e0f2fe; padding: 8px; }
    </style>
</head>
<body>
    <div class="item-card m-none">margin: 0</div>
    <div class="item-card m-all">margin: 20px — all sides</div>
    <div class="item-card m-auto">margin: 0 auto — centered!</div>

    <hr>
    <p class="product1">margin-bottom: 20px (Product A)</p>
    <p class="product2">margin-top: 30px (Product B) — gap is 30px, not 50px</p>
</body>
</html>
