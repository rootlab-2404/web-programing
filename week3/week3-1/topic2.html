<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- METHOD 1:METHOD 1: External CSS
     CSS is written in a separate .css file.
     It is the best choice for large or real projects.-->
  <link rel="stylesheet" href="style.css">

  <!-- METHOD 2:  Internal CSS
     CSS is written inside the <style> tag.
     It is useful for a single HTML page or a small project. -->
  <style>
    h2 { color: #1bf522; }
    p  { font-family: fantasy; }
  </style>
</head>
<body>
  <!-- METHOD 3: Inline CSS
     CSS is written directly inside the HTML tag.
     It is simple, but not recommended for large projects. -->
  <p style="color: rgb(172, 25, 25); font-size: 12px;">This is inline styled paragraph</p>

  <h2>this is internal styled heading</h2>
  <p>this is internal styled paragraph</p>
</body>
</html>
