<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ex-3 Color Palette</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px;
      font-family: Arial, sans-serif;
      background-color: #f8fafc;
    }

    .palette {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
    }

    .color-box {
      width: 130px;
      height: 120px;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .red {
      background-color: #EF4444;
    }

    .orange {
      background-color: #F59E0B;
    }

    .green {
      background-color: #10B981;
    }

    .blue {
      background-color: #3B82F6;
    }

    .purple {
      background-color: #8B5CF6;
    }
  </style>
</head>

<body>

  <div class="palette">

    <div class="color-box red">
      <div>Red</div>
      <div>#EF4444</div>
    </div>

    <div class="color-box orange">
      <div>Orange</div>
      <div>#F59E0B</div>
    </div>

    <div class="color-box green">
      <div>Green</div>
      <div>#10B981</div>
    </div>

    <div class="color-box blue">
      <div>Blue</div>
      <div>#3B82F6</div>
    </div>

    <div class="color-box purple">
      <div>Purple</div>
      <div>#8B5CF6</div>
    </div>

  </div>

</body>
</html>
