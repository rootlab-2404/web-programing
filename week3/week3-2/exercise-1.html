<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Exercise 1</title>
<style>
  .card {
    width: 280px;
    height: 180px;
    background: white;
    border: 2px solid #0f766e;
    border-radius: 12px;
    position: relative; /* anchor for the absolute badge */
    margin: 40px;
  }
  .badge {
    position: absolute;
    top: -12px;
    right: 16px;
    background: #0f766e;
    color: white;
    font-size: 12px;
    font-weight: bold;
    padding: 4px 12px;
    border-radius: 20px; /* pill shape */
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">SALE</span>
    <p style="padding:16px">Card content here</p>
  </div>
</body>
</html>
