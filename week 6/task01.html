<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Fetch a random joke, reveal the punchline, and keep your favourites on a set list."
    />
    <title>Random Joke Fetcher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=DM+Serif+Display:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Layout: a stage panel centred on a striped curtain; set list below it. */
      :root {
        --curtain: #4a0a18;
        --curtain-2: #5e0e20;
        --gold: #f0b94b;
        --ink: #fff3dc;
        --stage: #150a0e;
        --muted: #e0cbb8;
        --err: #ffb4b4;
        --f-display: "DM Serif Display", Georgia, "Times New Roman", serif;
        --f-label: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 40px 16px 64px;
        min-height: 100vh;
        color: var(--ink);
        background:
          linear-gradient(180deg, rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0) 40%),
          repeating-linear-gradient(
            90deg,
            var(--curtain) 0 34px,
            var(--curtain-2) 34px 68px
          );
        font: 18px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        max-width: 680px;
        margin: 0 auto;
      }
      .eyebrow {
        font-family: var(--f-label);
        font-weight: 700;
        font-size: 1rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--gold);
        margin: 0 0 8px;
      }
      h1 {
        font-family: var(--f-display);
        font-weight: 400;
        font-size: clamp(2.4rem, 8vw, 3.6rem);
        line-height: 1.05;
        margin: 0 0 12px;
        text-wrap: balance;
      }
      .lede {
        margin: 0 0 28px;
        color: var(--muted);
        max-width: 46ch;
      }
      .stage {
        background:
          radial-gradient(
            ellipse 80% 70% at 50% 0%,
            rgba(240, 185, 75, 0.24),
            transparent 70%
          ),
          var(--stage);
        border: 2px solid var(--gold);
        border-radius: 6px;
        padding: 28px 24px 24px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
      }
      .screen {
        min-height: 9.5rem;
      }
      #status {
        margin: 0;
        color: var(--muted);
      }
      #setup {
        font-family: var(--f-display);
        font-size: clamp(1.5rem, 5vw, 2rem);
        line-height: 1.25;
        margin: 0 0 14px;
        overflow-wrap: anywhere;
      }
      #punch {
        font-family: var(--f-display);
        font-style: italic;
        font-size: clamp(1.25rem, 4.2vw, 1.6rem);
        line-height: 1.3;
        color: var(--gold);
        margin: 0;
        overflow-wrap: anywhere;
      }
      .err {
        color: var(--err);
        font-weight: 600;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 22px;
      }
      button {
        font-family: var(--f-label);
        font-weight: 700;
        font-size: 1.05rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        min-height: 46px;
        padding: 8px 20px;
        border-radius: 3px;
        border: 2px solid var(--gold);
        background: transparent;
        color: var(--gold);
        cursor: pointer;
      }
      button.primary {
        background: var(--gold);
        color: #2a1500;
      }
      button:hover:not(:disabled) {
        background: rgba(240, 185, 75, 0.18);
      }
      button.primary:hover:not(:disabled) {
        background: #ffd072;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button:focus-visible,
      h2:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 3px;
      }
      #note {
        margin: 14px 0 0;
        min-height: 1.55em;
        font-size: 0.95rem;
        color: var(--muted);
      }
      h2 {
        font-family: var(--f-label);
        font-weight: 700;
        font-size: 1.15rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--gold);
        margin: 44px 0 14px;
      }
      ol {
        list-style: none;
        counter-reset: slot;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 10px;
      }
      li {
        counter-increment: slot;
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 14px;
        align-items: start;
        background: rgba(21, 10, 14, 0.9);
        border-left: 4px solid var(--gold);
        padding: 14px 16px;
      }
      li::before {
        content: counter(slot, decimal-leading-zero);
        font-family: var(--f-label);
        font-weight: 700;
        font-size: 1.3rem;
        color: var(--gold);
        line-height: 1.4;
      }
      li div {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      li .pl {
        display: block;
        margin-top: 4px;
        font-family: var(--f-display);
        font-style: italic;
        color: var(--gold);
      }
      li button {
        min-height: 44px;
        padding: 4px 14px;
        font-size: 0.95rem;
      }
      #none {
        color: var(--muted);
        margin: 0;
      }
      @media (max-width: 480px) {
        li {
          grid-template-columns: auto 1fr;
        }
        li button {
          grid-column: 1 / -1;
          justify-self: start;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Tonight's open mic</p>
      <h1>Random Joke Fetcher</h1>
      <p class="lede">
        Fetch a fresh joke, make everyone wait for the punchline, and keep the
        best ones on your set list.
      </p>

      <section class="stage">
        <div class="screen" role="status" aria-live="polite" aria-atomic="false">
          <p id="status">Press "Load joke" to bring out the first act.</p>
          <p id="setup" hidden></p>
          <p id="punch" hidden></p>
        </div>
        <div class="row">
          <button id="load" type="button" class="primary">Load joke</button>
          <button id="reveal" type="button" disabled>Reveal punchline</button>
          <button id="save" type="button" disabled>Add to set list</button>
        </div>
        <p id="note" role="status" aria-live="polite"></p>
      </section>

      <h2 id="h-set" tabindex="-1">Set list</h2>
      <ol id="favs" aria-labelledby="h-set"></ol>
      <p id="none">Nothing on the set list yet.</p>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      let current = null,
        favs = [];
      try {
        favs = JSON.parse(localStorage.getItem("jokeSetList") || "[]");
        if (!Array.isArray(favs)) favs = [];
      } catch (e) {
        favs = [];
      }

      async function fetchJson(url) {
        const ctl = new AbortController();
        const timer = setTimeout(() => ctl.abort(), 8000);
        try {
          const r = await fetch(url, { signal: ctl.signal });
          if (!r.ok) throw new Error("HTTP " + r.status);
          return await r.json();
        } finally {
          clearTimeout(timer);
        }
      }

      async function getJoke() {
        try {
          const d = await fetchJson(
            "https://official-joke-api.appspot.com/random_joke",
          );
          if (!d.setup) throw new Error("Empty response");
          return { setup: d.setup, punchline: d.punchline || "" };
        } catch (e) {
          const d = await fetchJson(
            "https://v2.jokeapi.dev/joke/Programming?safe-mode",
          );
          if (d.error) throw new Error(d.message || "API error");
          return d.type === "single"
            ? { setup: d.joke, punchline: "" }
            : { setup: d.setup, punchline: d.delivery };
        }
      }

      async function load() {
        $("load").disabled = true;
        $("reveal").disabled = true;
        $("save").disabled = true;
        $("note").textContent = "";
        $("punch").hidden = true;
        $("setup").hidden = true;
        $("status").className = "";
        $("status").textContent = "Finding a joke…";
        $("status").hidden = false;
        try {
          current = await getJoke();
          $("setup").textContent = current.setup;
          $("punch").textContent = current.punchline;
          $("setup").hidden = false;
          $("status").hidden = true;
          $("reveal").disabled = !current.punchline;
          $("save").disabled = false;
        } catch (e) {
          current = null;
          $("status").className = "err";
          $("status").textContent =
            "Could not load a joke (" +
            e.message +
            "). Check your connection and try again.";
        }
        $("load").disabled = false;
      }

      function reveal() {
        if (!current || !current.punchline) return;
        $("punch").hidden = false;
        $("reveal").disabled = true;
        $("load").focus();
      }

      function renderFavs() {
        $("favs").innerHTML = "";
        $("none").hidden = favs.length > 0;
        favs.forEach((j, i) => {
          const li = document.createElement("li");
          const t = document.createElement("div");
          t.textContent = j.setup;
          if (j.punchline) {
            const s = document.createElement("span");
            s.className = "pl";
            s.textContent = j.punchline;
            t.appendChild(s);
          }
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = "Remove";
          b.setAttribute(
            "aria-label",
            "Remove from set list: " + j.setup.slice(0, 50),
          );
          b.onclick = () => {
            favs.splice(i, 1);
            persist();
            $("note").textContent = "Removed from the set list.";
            const btns = $("favs").querySelectorAll("button");
            (btns[i] || btns[i - 1] || $("h-set")).focus();
          };
          li.append(t, b);
          $("favs").appendChild(li);
        });
      }

      function persist() {
        try {
          localStorage.setItem("jokeSetList", JSON.stringify(favs));
        } catch (e) {}
        renderFavs();
      }

      $("load").onclick = load;
      $("reveal").onclick = reveal;
      $("save").onclick = () => {
        if (!current) return;
        const exists = favs.some(
          (f) => f.setup === current.setup && f.punchline === current.punchline,
        );
        if (exists) {
          $("note").textContent = "Already on your set list.";
          return;
        }
        favs.push(current);
        persist();
        $("note").textContent = "Added to your set list.";
      };
      renderFavs();
    </script>
  </body>
</html>
