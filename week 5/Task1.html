<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 5 Exercise 1</title>
<style>
  * { box-sizing: border-box; }

  body {
    font-family: Arial, sans-serif;
    background: #e8f1f8;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0;
  }

  .box {
    background: white;
    padding: 32px;
    border-radius: 14px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
    text-align: center;
    width: 320px;
  }

  h1 {
    color: #334155;
    margin-top: 0;
  }

  #number {
    font-size: 60px;
    font-weight: bold;
    color: #334155;
    margin: 20px 0 8px;
  }

  #number.positive { color: #16a34a; }
  #number.negative { color: #dc2626; }

  #message {
    color: #64748b;
    margin: 0 0 20px;
    min-height: 20px;
  }

  .step {
    margin-bottom: 18px;
    color: #475569;
  }

  .step select {
    padding: 4px 8px;
    border-radius: 6px;
    border: 1px solid #cbd5e1;
    font-size: 15px;
  }

  button {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    color: white;
    cursor: pointer;
    margin: 3px;
  }

  button:hover { opacity: 0.85; }

  #plus  { background: #0d9488; }
  #minus { background: #f59e0b; }
  #reset { background: #64748b; }
</style>
</head>
<body>

  <div class="box">
    <h1>Counter</h1>

    <div id="number">0</div>
    <p id="message">Press a button to start</p>

    <div class="step">
      Step:
      <select id="step">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="5">5</option>
        <option value="10">10</option>
      </select>
    </div>

    <button id="minus">− Minus</button>
    <button id="plus">+ Plus</button>
    <button id="reset">Reset</button>
  </div>

  <script>
    // 1. Select elements
    const numberEl = document.getElementById("number");
    const messageEl = document.getElementById("message");
    const stepEl = document.getElementById("step");
    const plusBtn = document.getElementById("plus");
    const minusBtn = document.getElementById("minus");
    const resetBtn = document.getElementById("reset");

    // 2. Counter variable
    let count = 0;

    // 3. Update the screen
    function updateScreen() {
      numberEl.textContent = count;

      numberEl.classList.remove("positive", "negative");
      if (count > 0) {
        numberEl.classList.add("positive");
        messageEl.textContent = "The number is positive";
      } else if (count < 0) {
        numberEl.classList.add("negative");
        messageEl.textContent = "The number is negative";
      } else {
        messageEl.textContent = "The number is zero";
      }
    }

    // 4. Get the selected step as a number
    function getStep() {
      return Number(stepEl.value);
    }

    // 5. Button events
    plusBtn.addEventListener("click", function () {
      count = count + getStep();
      updateScreen();
    });

    minusBtn.addEventListener("click", function () {
      count = count - getStep();
      updateScreen();
    });

    resetBtn.addEventListener("click", function () {
      count = 0;
      updateScreen();
    });
  </script>

</body>
</html>
