<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Asadbek Nosirjonov</title>
  <style>
    :root {
      --bg: #dfeee6;
      --panel: #0f5132;
      --panel-2: #072c1b;
      --paper: #ffffff;
      --text: #12261b;
      --muted: #5b7266;
      --line: #d3e0d8;
      --accent: #0f9d58;
      --accent-2: #3ddc97;
      --gold: #e9c46a;
      --green: #12a150;
      --danger: #d6336c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: grid; place-items: center; padding: 28px 16px;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--text); line-height: 1.5;
      background:
        radial-gradient(circle at 12% 18%, rgba(61, 220, 151, .35), transparent 38%),
        radial-gradient(circle at 88% 82%, rgba(233, 196, 106, .35), transparent 36%),
        radial-gradient(circle at 80% 10%, rgba(15, 157, 88, .18), transparent 30%),
        var(--bg);
    }
    .card {
      width: 100%; max-width: 940px;
      display: grid; grid-template-columns: 310px 1fr;
      background: var(--paper); border-radius: 28px; overflow: hidden;
      box-shadow: 0 30px 70px rgba(7, 44, 27, .28), 0 0 0 1px rgba(255, 255, 255, .6);
      animation: rise .6s cubic-bezier(.2, .8, .2, 1) both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.98); } to { opacity: 1; transform: none; } }

    /* Left panel */
    aside {
      position: relative; overflow: hidden;
      background: linear-gradient(165deg, var(--panel) 0%, var(--panel-2) 100%);
      color: #eaf7ef; padding: 36px 28px;
      display: flex; flex-direction: column; gap: 28px;
    }
    aside::before, aside::after {
      content: ""; position: absolute; border-radius: 50%; pointer-events: none;
    }
    aside::before { width: 260px; height: 260px; right: -110px; top: -90px; background: radial-gradient(circle, rgba(61, 220, 151, .35), transparent 70%); }
    aside::after { width: 220px; height: 220px; left: -90px; bottom: -80px; border: 2px solid rgba(233, 196, 106, .35); box-shadow: 0 0 0 28px rgba(233, 196, 106, .08); }
    aside > * { position: relative; z-index: 1; }
    .badge {
      width: 64px; height: 64px; border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), #f6e3a1); color: var(--panel-2);
      display: grid; place-items: center; font-size: 1.45rem; font-weight: 700;
      box-shadow: 0 0 0 6px rgba(233, 196, 106, .22), 0 10px 24px rgba(0, 0, 0, .3);
    }
    aside h2 { margin: 0; font-size: 1.55rem; line-height: 1.15; font-style: italic; letter-spacing: .01em; }
    aside .sid {
      display: inline-block; margin-top: 8px; padding: 3px 12px; border-radius: 999px;
      background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .18);
      font-family: ui-monospace, Consolas, monospace; font-size: .82rem; letter-spacing: .06em;
    }
    aside h3 { margin: 0 0 12px; font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); font-family: system-ui, sans-serif; }
    .checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 11px; font-family: system-ui, sans-serif; font-size: .9rem; }
    .checks li { display: flex; align-items: center; gap: 12px; opacity: .6; transition: opacity .25s, transform .25s; }
    .checks li::before {
      content: ""; width: 20px; height: 20px; border-radius: 50%;
      border: 2px solid rgba(143, 209, 172, .7); flex: none; transition: all .25s;
    }
    .checks li.ok { opacity: 1; transform: translateX(4px); }
    .checks li.ok::before {
      content: "\2713"; display: grid; place-items: center;
      background: var(--accent-2); border-color: var(--accent-2); color: var(--panel-2);
      font-size: .72rem; font-weight: 800; box-shadow: 0 0 14px rgba(61, 220, 151, .6);
    }

    /* Form side */
    .form-side { padding: 38px 40px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: linear-gradient(180deg, #fff, #fbfdfc); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
    fieldset { border: 0; padding: 0; margin: 0 0 20px; }
    legend {
      font-family: Georgia, serif; font-size: 1.3rem; font-weight: 700; font-style: italic;
      margin-bottom: 6px; color: var(--panel); padding: 0;
    }
    legend::after { content: ""; display: block; width: 36px; height: 3px; margin-top: 4px; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--gold)); }
    label { display: block; margin: 14px 0 6px 6px; font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    input[type="text"], input[type="email"], input[type="password"], select {
      width: 100%; padding: 12px 18px;
      background: #f4f9f6; color: var(--text);
      border: 1.5px solid var(--line); border-radius: 999px;
      font: inherit; box-shadow: inset 0 2px 4px rgba(15, 81, 50, .05);
      transition: border-color .2s, box-shadow .2s, background .2s, transform .2s;
    }
    input::placeholder { color: #9bb0a4; }
    input:hover, select:hover { border-color: #b7cfc2; }
    input:focus, select:focus {
      outline: none; border-color: var(--accent); background: #fff;
      box-shadow: 0 0 0 5px rgba(15, 157, 88, .14), 0 6px 16px rgba(15, 157, 88, .12);
      transform: translateY(-1px);
    }
    input[aria-invalid="true"], select[aria-invalid="true"] { border-color: var(--danger); background: #fff5f8; }
    input[aria-invalid="true"]:focus { box-shadow: 0 0 0 5px rgba(214, 51, 108, .14); }
    input[aria-invalid="false"], select[aria-invalid="false"] { border-color: var(--green); background: #f1fbf5; }

    .hint { display: block; color: var(--muted); font-size: .78rem; margin: 5px 0 0 18px; }
    .err { display: block; color: var(--danger); font-size: .78rem; font-weight: 600; min-height: 1.1em; margin: 5px 0 0 18px; }

    .meter { height: 6px; background: var(--line); border-radius: 6px; margin: 9px 10px 0; overflow: hidden; }
    .meter span { display: block; height: 100%; width: 0; border-radius: 6px; background: var(--danger); transition: width .3s, background .3s; }
    .show { display: flex; align-items: center; gap: 8px; margin: 14px 0 0 6px; font-weight: 500; text-transform: none; letter-spacing: 0; font-size: .88rem; }
    .show input { accent-color: var(--accent); width: 16px; height: 16px; }

    .controls { display: flex; gap: 12px; margin-top: 10px; }
    button {
      padding: 13px 30px; border: 0; border-radius: 999px; cursor: pointer;
      font: inherit; font-weight: 700; letter-spacing: .03em;
      background: linear-gradient(135deg, var(--accent), #0b7a45); color: #fff;
      box-shadow: 0 10px 22px rgba(15, 157, 88, .35);
      transition: transform .2s, box-shadow .2s, filter .2s;
    }
    button.secondary { background: transparent; color: var(--muted); border: 1.5px solid var(--line); box-shadow: none; }
    button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 14px 28px rgba(15, 157, 88, .42); }
    button.secondary:hover:not(:disabled) { box-shadow: none; border-color: var(--muted); color: var(--text); }
    button:active:not(:disabled) { transform: translateY(0); }
    button:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }

    .success {
      margin-top: 20px; padding: 16px 20px; border-radius: 16px;
      background: linear-gradient(135deg, #e6f6ec, #f6fbe8); border: 1px solid var(--green); color: #0b5a2e;
      animation: rise .4s ease both;
    }
    .success[hidden] { display: none; }

    @media (max-width: 780px) {
      .card { grid-template-columns: 1fr; }
      .row { grid-template-columns: 1fr; }
      .form-side { padding: 26px 20px; }
      aside { padding: 28px 22px; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    </style>
</head>
<body>
  <div class="card">
    <aside>
      <div class="badge" aria-hidden="true">AN</div>
      <div>
        <h2>Asadbek Nosirjonov</h2>
        <div class="sid">ID: 202537228</div>
      </div>
      <div>
        <h3>Checklist</h3>
        <ul class="checks" aria-live="polite">
          <li id="c-name">Name entered</li>
          <li id="c-sid">9-digit student ID</li>
          <li id="c-email">Valid email</li>
          <li id="c-major">Major chosen</li>
          <li id="c-pw">Strong password</li>
          <li id="c-pw2">Passwords match</li>
        </ul>
      </div>
    </aside>

    <div class="form-side">
      <form id="regForm" action="#" method="post" novalidate>
        <fieldset>
          <legend>Student Info</legend>

          <label for="sname">Full Name</label>
          <input type="text" id="sname" name="sname" placeholder="Asadbek Nosirjonov" required minlength="2" maxlength="50" autocomplete="name" aria-describedby="err-sname">
          <span class="err" id="err-sname" role="alert"></span>

          <div class="row">
            <div>
              <label for="sid">Student ID</label>
              <input type="text" id="sid" name="sid" placeholder="202537228" required inputmode="numeric" maxlength="9" aria-describedby="hint-sid err-sid">
              <span class="hint" id="hint-sid">Exactly 9 digits</span>
              <span class="err" id="err-sid" role="alert"></span>
            </div>
            <div>
              <label for="major">Major</label>
              <select id="major" name="major" required aria-describedby="err-major">
                <option value="" disabled selected>Choose...</option>
                <option>Computer Science</option>
                <option>Software Engineering</option>
                <option>Electronics</option>
                <option>Business</option>
                <option>Other</option>
              </select>
              <span class="err" id="err-major" role="alert"></span>
            </div>
          </div>

          <label for="semail">University Email</label>
          <input type="email" id="semail" name="semail" placeholder="name@gachon.ac.kr" required autocomplete="email" aria-describedby="err-semail">
          <span class="err" id="err-semail" role="alert"></span>
        </fieldset>

        <fieldset>
          <legend>Account</legend>

          <div class="row">
            <div>
              <label for="pw">Password</label>
              <input type="password" id="pw" name="pw" required minlength="8" autocomplete="new-password" aria-describedby="hint-pw err-pw">
              <div class="meter" aria-hidden="true"><span id="meter-bar"></span></div>
              <span class="hint" id="hint-pw">8+ characters, a letter and a number</span>
              <span class="err" id="err-pw" role="alert"></span>
            </div>
            <div>
              <label for="pw2">Confirm Password</label>
              <input type="password" id="pw2" name="pw2" required autocomplete="new-password" aria-describedby="err-pw2">
              <span class="err" id="err-pw2" role="alert"></span>
            </div>
          </div>

          <label class="show"><input type="checkbox" id="show-pw"> Show passwords</label>
        </fieldset>

        <div class="controls">
          <button type="submit" id="submit-btn" disabled>Create Account</button>
          <button type="reset" class="secondary">Reset</button>
        </div>
      </form>

      <div id="success" class="success" role="status" hidden></div>
    </div>
  </div>

  <script>
    const form = document.getElementById('regForm');
    const submitBtn = document.getElementById('submit-btn');
    const success = document.getElementById('success');
    const meterBar = document.getElementById('meter-bar');
    const $ = (id) => document.getElementById(id);

    function markValid(input, span) {
      input.setAttribute('aria-invalid', 'false');
      span.textContent = '';
    }
    function markInvalid(input, span, msg) {
      input.setAttribute('aria-invalid', 'true');
      span.textContent = msg;
    }

    const nameRe = /^[A-Za-z' \-]+$/;
    const hasLetterAndNumber = (v) => /[A-Za-z]/.test(v) && /\d/.test(v);

    function validateName() {
      const el = $('sname'), err = $('err-sname');
      if (el.validity.valueMissing) return markInvalid(el, err, 'Full name is required'), false;
      if (el.validity.tooShort) return markInvalid(el, err, 'Name must be at least 2 characters'), false;
      if (!nameRe.test(el.value.trim())) return markInvalid(el, err, 'Use letters, spaces, apostrophes or hyphens only'), false;
      return markValid(el, err), true;
    }

    function validateSid() {
      const el = $('sid'), err = $('err-sid');
      if (el.validity.valueMissing) return markInvalid(el, err, 'Student ID is required'), false;
      if (!/^\d{9}$/.test(el.value)) return markInvalid(el, err, 'Must be exactly 9 digits'), false;
      return markValid(el, err), true;
    }

    function validateEmail() {
      const el = $('semail'), err = $('err-semail');
      if (el.validity.valueMissing) return markInvalid(el, err, 'Email is required'), false;
      if (el.validity.typeMismatch) return markInvalid(el, err, 'Enter a valid email, like name@gachon.ac.kr'), false;
      return markValid(el, err), true;
    }

    function validateMajor() {
      const el = $('major'), err = $('err-major');
      if (el.validity.valueMissing) return markInvalid(el, err, 'Please choose a major'), false;
      return markValid(el, err), true;
    }

    function passwordScore(v) {
      let s = 0;
      if (v.length >= 8) s++;
      if (v.length >= 12) s++;
      if (hasLetterAndNumber(v)) s++;
      if (/[^A-Za-z0-9]/.test(v)) s++;
      return s; // 0..4
    }

    function updateMeter() {
      const s = passwordScore($('pw').value);
      const colors = ['#d6336c', '#d6336c', '#f08c00', '#74b816', '#12a150'];
      meterBar.style.width = (s * 25) + '%';
      meterBar.style.background = colors[s];
    }

    function validatePassword() {
      const el = $('pw'), err = $('err-pw');
      const v = el.value;
      el.setCustomValidity(v && !hasLetterAndNumber(v) ? 'Needs a letter and a number' : '');
      if (el.validity.valueMissing) return markInvalid(el, err, 'Password is required'), false;
      if (el.validity.tooShort) return markInvalid(el, err, 'At least 8 characters'), false;
      if (el.validity.customError) return markInvalid(el, err, 'Needs a letter and a number'), false;
      return markValid(el, err), true;
    }

    function validateConfirm() {
      const el = $('pw2'), err = $('err-pw2');
      el.setCustomValidity(el.value !== $('pw').value ? 'Passwords do not match' : '');
      if (el.validity.valueMissing) return markInvalid(el, err, 'Please confirm your password'), false;
      if (el.validity.customError) return markInvalid(el, err, el.validationMessage), false;
      return markValid(el, err), true;
    }

    const validators = { sname: validateName, sid: validateSid, semail: validateEmail, major: validateMajor, pw: validatePassword, pw2: validateConfirm };
    const validateAll = () => Object.values(validators).map((v) => v()).every(Boolean);

    // Live checklist in the side panel
    function updateChecklist() {
      const pw = $('pw').value;
      const state = {
        'c-name': $('sname').value.trim().length >= 2 && nameRe.test($('sname').value.trim()),
        'c-sid': /^\d{9}$/.test($('sid').value),
        'c-email': $('semail').value !== '' && $('semail').validity.valid,
        'c-major': $('major').value !== '',
        'c-pw': pw.length >= 8 && hasLetterAndNumber(pw),
        'c-pw2': $('pw2').value !== '' && $('pw2').value === pw
      };
      Object.entries(state).forEach(([id, ok]) => $(id).classList.toggle('ok', ok));
    }

    function updateButton() {
      const sid = $('sid');
      sid.setCustomValidity(/^\d{9}$/.test(sid.value) || sid.value === '' ? '' : 'Must be exactly 9 digits');
      $('pw2').setCustomValidity($('pw2').value !== $('pw').value ? 'Passwords do not match' : '');
      const pw = $('pw').value;
      $('pw').setCustomValidity(pw && !hasLetterAndNumber(pw) ? 'Needs a letter and a number' : '');
      const nameOk = nameRe.test($('sname').value.trim());
      submitBtn.disabled = !(form.checkValidity() && nameOk);
      updateChecklist();
    }

    Object.entries(validators).forEach(([id, validate]) => {
      const evt = id === 'major' ? 'change' : 'input';
      $(id).addEventListener(evt, () => {
        validate();
        if (id === 'pw') {
          updateMeter();
          if ($('pw2').value) validateConfirm();
        }
        updateButton();
      });
    });

    $('show-pw').addEventListener('change', (e) => {
      const type = e.target.checked ? 'text' : 'password';
      $('pw').type = type;
      $('pw2').type = type;
    });

    // Final gate: never trust the disabled button alone
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      updateButton();
      if (!validateAll()) {
        success.hidden = true;
        const bad = form.querySelector('[aria-invalid="true"]');
        if (bad) bad.focus();
        return;
      }
      const name = $('sname').value.trim();
      const major = $('major').value;
      form.reset();
      success.textContent = 'Welcome, ' + name + '! Your ' + major + ' account was created (demo only, nothing is sent).';
      success.hidden = false;
    });

    form.addEventListener('reset', () => {
      success.hidden = true;
      $('pw').type = 'password';
      $('pw2').type = 'password';
      form.querySelectorAll('input, select').forEach((el) => { el.removeAttribute('aria-invalid'); el.setCustomValidity(''); });
      form.querySelectorAll('.err').forEach((s) => { s.textContent = ''; });
      setTimeout(() => { updateMeter(); updateButton(); });
    });

    updateMeter();
    updateButton();
  </script>
</body>
</html>
