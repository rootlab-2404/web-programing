<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asadbek - Web Development Assignments</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #eef2f7;
      color: #1f2937;
      min-height: 100vh;
      padding: 32px 16px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* Horizontal profile card */
    .profile-card {
      display: flex;
      align-items: center;
      gap: 24px;
      background-color: #ffffff;
      border: 3px solid #4f46e5;
      border-radius: 20px;
      padding: 28px 32px;
      box-shadow: 0 6px 18px rgba(79, 70, 229, 0.15);
    }

    .profile-card h1 {
      flex: 0 0 auto;
      font-size: 2rem;
      color: #4f46e5;
    }

    .profile-card p {
      flex: 1;
      font-size: 1.05rem;
      line-height: 1.6;
      color: #374151;
    }

    /* Week cards */
    .weeks {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    a{
        text-decoration: none;
        align-items: center;
    }

    .week-card {
      width: 100%;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;  
      padding: 0 24px;
      background-color: #e0e7ff;
      border: 2px solid #6366f1;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #3730a3;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .week-card:hover {
      transform: translateY(-2px);
      background-color: #c7d2fe;
    }

    /* Responsive: stack profile card on small screens */
    @media (max-width: 600px) {
      body {
        padding: 20px 12px;
      }

      .profile-card {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
        padding: 22px 20px;
      }

      .profile-card h1 {
        font-size: 1.6rem;
      }

      .profile-card p {
        font-size: 1rem;
      }

      .week-card {
        height: 50px;
        font-size: 1rem;
        padding: 0 18px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="profile-card">
      <h1>Asadbek</h1>
      <p>
        I am a student with Computer Engineering major. I am interested in
        web-developing and cyber security. This page shows my assignments for
        Web-developing class.
      </p>
    </div>

  

  <div class="weeks">

  

      <div class="week-card"><a href="./week2container.html">Week 2</a></div>
      <div class="week-card"><a href="./week3container.html">Week 3</a></div>
      <div class="week-card"><a href="./week4container.html">Week 4</a></div>
      <div class="week-card"><a href="./week5container.html">Week 5</a></div>
      <div class="week-card"><a href="./week6container.html">Week 6</a></div>
      <div class="week-card"><a href="./week7container.html">Week 7</a></div>
      <div class="week-card"><a href="./week8container.html">Week 8</a></div>

  </div>
</body>
</html>
