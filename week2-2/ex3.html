<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Figures</title></head>
<body>

  <!-- Figure 1: image with figcaption -->
  <figure>
    <img src="https://picsum.photos/400/250?random=10"
         alt="A random landscape photograph"
         width="400"
         height="250">
    <figcaption>A beautiful random landscape image.</figcaption>
  </figure>

  <!-- Sentence with time element -->
  <p>Today's date is <time datetime="2026-09-05">September 5, 2026</time>.</p>

  <!-- Figure 2: pre+code block with figcaption -->
  <figure>
    <pre><code>&lt;!DOCTYPE html&gt;
&lt;html lang="en"&gt;
&lt;head&gt;
  &lt;meta charset="UTF-8"&gt;
  &lt;title&gt;My Page&lt;/title&gt;
&lt;/head&gt;
&lt;body&gt;</code></pre>
    <figcaption>A basic HTML skeleton.</figcaption>
  </figure>

</body>
</html>
